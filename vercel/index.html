<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Installable evaluator and admin analytics for MCI triage training." />
    <meta name="theme-color" content="#0f6b3e" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>MCI Triage Evaluation</title>
  </head>
  <body>
    <div id="root">
      <main style="max-width:420px;margin:15vh auto;padding:24px;font-family:system-ui;color:#164b35">
        <h1>MCI Triage Evaluation</h1>
        <p>Loading score sheet...</p>
        <div id="app-recovery" hidden>
          <p>The app could not finish loading. Connect to the internet and try again. Your saved records will stay on this device.</p>
          <button onclick="location.reload()" style="padding:12px 20px;background:#146c43;color:white;border:0;border-radius:6px">Try again</button>
        </div>
      </main>
    </div>
    <script>
      // This recovery path runs even when the app's JavaScript fails to load.
      setTimeout(function () {
        var recovery = document.getElementById('app-recovery');
        if (recovery) recovery.hidden = false;
      }, 8000);
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).then(function (registration) {
          registration.update().catch(function () {});
        }).catch(function () {});
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (document.getElementById('app-recovery')) location.reload();
        });
      }
    </script>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
